# E2E tier (design 2026-10-21): full suite nightly + manual dispatch.
#
# Driver stack: DRIVER_MODE=direct - the factory talks straight to
# WinAppDriver (:4729); no Node/Appium install for the tests. Node is only
# needed for the Allure CLI report (preinstalled on hosted runners).
# TC019 is the INTENTIONAL demo failure - deselected here, untouched in the
# repo; it still runs locally under `all`.
#
# SPIKE NOTE: this is the first run of the GUI E2E stack outside the dev
# machine. WAD needs an interactive desktop session + Developer Mode; if
# hosted runners prove unstable here, the agreed fallback is self-hosted.
name: e2e-nightly

on:
  schedule:
    - cron: '30 2 * * *' # ~06:00 local (UTC+3:30)
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  e2e:
    name: e2e (full suite, TC019 deselected)
    runs-on: windows-latest
    timeout-minutes: 30
    # No DRIVER_MODE: the PRD-primary Appium path (default). Direct mode
    # (WAD only) is broken with selenium 4 - WAD 1.2.1 parses legacy JSONWP
    # caps, selenium sends the W3C envelope, so session creation 400s with
    # "Bad capabilities" (probed on the runner, 2026-10-20/21).
    steps:
      - uses: actions/checkout@v4

      # 3.14 on purpose: install-qt-action runs its own internal setup-python
      # with '>=3.14.0' and prepends it to PATH - aligning on the SAME
      # interpreter avoids the 'python has no pytest' mismatch (observed on
      # the first spike run). Deps install AFTER the Qt step (see below).
      - name: Set up Python 3.14
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: automation/requirements.txt

      - name: Install CMake 3.30.5 + Ninja
        uses: lukka/get-cmake@v4.4.4
        with:
          cmakeVersion: '3.30.5'

      - name: Install Qt 6.8.3 (win64_mingw) + MinGW toolchain
        uses: jurplel/install-qt-action@v4.4.1
        with:
          version: '6.8.3'
          arch: win64_mingw
          dir: 'C:\Qt'
          modules: 'qtcharts'
          tools: 'tools_mingw1310'
          cache: true

      - name: Wire IST_* tool paths
        shell: pwsh
        run: |
          $gxx = Get-ChildItem "$env:IQTA_TOOLS\mingw*\bin\g++.exe" |
                 Select-Object -First 1
          if (-not $gxx) {
            $gxx = Get-ChildItem 'C:\Qt*\Tools\mingw*\bin\g++.exe' |
                   Select-Object -First 1
          }
          if (-not $gxx) {
            throw 'MinGW g++ not found under IQTA_TOOLS / C:\Qt*\Tools'
          }
          Add-Content $env:GITHUB_ENV "IST_QT_BIN=$env:QT_ROOT_DIR\bin"
          Add-Content $env:GITHUB_ENV "IST_GCC=$(Join-Path $gxx.DirectoryName 'gcc.exe')"
          Add-Content $env:GITHUB_ENV "IST_GXX=$($gxx.FullName)"
          Add-Content $env:GITHUB_ENV "IST_CMAKE=$((Get-Command cmake.exe).Source)"
          Add-Content $env:GITHUB_ENV "IST_NINJA=$((Get-Command ninja.exe).Source)"

      # AFTER install-qt-action: its internal setup-python (>=3.14.0) has
      # already reshaped PATH, so python -m pip binds to the same
      # interpreter pytest will run under.
      - name: Install test deps + Allure CLI + Appium stack
        shell: pwsh
        run: |
          python -m pip install -r automation\requirements.txt
          npm install -g allure@3.21.0
          npm install -g appium@3.8.0
          appium driver install --source npm appium-windows-driver@6.3.1
          # Appium 3 house-peering fix (docs/env-setup.md): the per-user
          # ~/.appium/node_modules needs an 'appium' junction to the global
          # npm package or the windows driver fails to load under Appium 3.
          $appiumHome = Join-Path $env:USERPROFILE '.appium\node_modules'
          New-Item -ItemType Directory -Force $appiumHome | Out-Null
          $target = Join-Path (npm root -g) 'appium'
          if (-not (Test-Path (Join-Path $appiumHome 'appium'))) {
            New-Item -ItemType Junction -Path (Join-Path $appiumHome 'appium') -Target $target | Out-Null
          }

      - name: Build + deploy Qt runtime
        shell: pwsh
        run: powershell -ExecutionPolicy Bypass -File scripts\build.ps1

      # WAD exits 0x80004005 without Developer Mode (docs/env-setup.md).
      - name: Enable Developer Mode + install WinAppDriver 1.2.1
        shell: pwsh
        run: |
          reg add "HKLM\SOFTWARE\Microsoft\Windows\CurrentVersion\AppModelUnlock" /v AllowDevelopmentWithoutDevLicense /t REG_DWORD /d 1 /f
          $msi = Join-Path $env:RUNNER_TEMP 'WindowsApplicationDriver_1.2.1.msi'
          Invoke-WebRequest -Uri 'https://github.com/microsoft/WinAppDriver/releases/download/v1.2.1/WindowsApplicationDriver_1.2.1.msi' -OutFile $msi
          Start-Process msiexec.exe -ArgumentList "/i `"$msi`" /qn /norestart" -Wait
          $exe = "${env:ProgramFiles(x86)}\Windows Application Driver\WinAppDriver.exe"
          if (-not (Test-Path $exe)) { throw 'WinAppDriver.exe missing after MSI install' }

      # The Appium windows driver spawns/manages WinAppDriver.exe itself per
      # session; CI only has to provide the server (conftest's
      # stack_available probes :4723 before the first launch).
      - name: Start Appium on :4723
        shell: pwsh
        run: |
          $diag = Join-Path $env:GITHUB_WORKSPACE 'diagnostics'
          New-Item -ItemType Directory -Force $diag | Out-Null
          $appium = (Get-Command appium.cmd -ErrorAction SilentlyContinue).Source
          if (-not $appium) { throw 'appium.cmd not on PATH after npm -g install' }
          # Plain Start-Process = fresh console with its OWN stdin. Do NOT
          # -RedirectStandardOutput/-Error here: the child then inherits the
          # step's stdin, which EOFs when this step exits - and Appium exits
          # on stdin close (observed: server dead before pytest, while WAD
          # started the same way as a plain console survives across steps).
          Start-Process -FilePath $appium -ArgumentList '--port', '4723', '--log', "$diag\appium.log"
          $ok = $false
          for ($i = 0; $i -lt 90; $i++) {
            try { $c = New-Object System.Net.Sockets.TcpClient('127.0.0.1', 4723); $c.Close(); $ok = $true; break }
            catch { Start-Sleep -Seconds 1 }
          }
          if (-not $ok) { throw 'Appium never answered on 4723' }

      # Per-test fixture isolation (isolate_db) needs no pre-restore: it
      # restores + migrates the mapped fixture before EVERY test.
      # The post-pytest capture is temporary spike validation: on failure the
      # app process from the last attach is usually still alive, so the
      # screenshot + window dump in THAT context is the evidence
      # (factory.wait_hwnd also dumps EnumWindows into the failure message).
      - name: Run E2E suite (TC019 deselected)
        shell: pwsh
        working-directory: automation
        run: |
          $results = Join-Path $env:GITHUB_WORKSPACE 'reports\allure-results'
          python -m pytest tests -v --alluredir=$results --deselect tests/test_tc019_demo_failure.py::test_tc019_demo_failure
          $rc = $LASTEXITCODE
          $diag = Join-Path $env:GITHUB_WORKSPACE 'diagnostics'
          New-Item -ItemType Directory -Force $diag | Out-Null
          Get-Process IranSignalTracker -ErrorAction SilentlyContinue |
            Select-Object Id, Responding, MainWindowTitle |
            Out-File "$diag\post-pytest-windows.txt" -Width 300
          Add-Type -AssemblyName System.Windows.Forms
          Add-Type -AssemblyName System.Drawing
          $bounds = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
          $bmp = New-Object System.Drawing.Bitmap $bounds.Width, $bounds.Height
          $g = [System.Drawing.Graphics]::FromImage($bmp)
          $g.CopyFromScreen($bounds.Location, [System.Drawing.Point]::Empty, $bounds.Size)
          $bmp.Save("$diag\post-pytest-desktop.png")
          exit $rc

      - name: Upload spike diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: desktop-diagnostics
          path: diagnostics/
          retention-days: 7

      # Retry mirrors scripts/run-allure.ps1 (AV-scan EPERM race on Windows).
      - name: Generate Allure report
        if: always()
        shell: pwsh
        run: |
          $results = Join-Path $env:GITHUB_WORKSPACE 'reports\allure-results'
          $report  = Join-Path $env:GITHUB_WORKSPACE 'reports\allure-report'
          # Nothing to generate when the tests never ran (upstream step
          # failed) - fail soft so the report step doesn't mask the real
          # error; the job is already red at that point.
          if (-not (Test-Path $results)) {
            Write-Host 'no allure-results - tests never ran; skipping report generation'
            exit 0
          }
          $ok = $false
          for ($attempt = 1; $attempt -le 3; $attempt++) {
            if (Test-Path $report) { Remove-Item -Recurse -Force $report }
            allure generate "$results" -o "$report" --clean
            if ($LASTEXITCODE -eq 0) { $ok = $true; break }
            Write-Host "allure generate failed (exit $LASTEXITCODE), retry $attempt/3 ..."
            Start-Sleep -Seconds (2 * $attempt)
          }
          if (-not $ok) { throw 'allure generate kept failing after 3 attempts' }

      - name: Upload Allure results + report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-allure
          path: |
            reports/allure-results/
            reports/allure-report/
          retention-days: 14